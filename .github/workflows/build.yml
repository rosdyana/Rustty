name: Build Rustty

on:
  push:
    tags:
      - "v*"          # Lanzar al hacer: git tag v0.1.0 && git push --tags
  workflow_dispatch:  # También se puede lanzar manualmente desde GitHub

permissions:
  contents: write

# Dos ejecuciones del mismo tag tampoco deben crear/publicar borradores a la vez.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate de publicación ───────────────────────────────────────
  # Corre ANTES que `build` (que es quien recibe los secretos) y con
  # `permissions: contents: read`. Si algo aquí falla, no se compila ni se
  # publica nada: los secretos ni se exponen.
  #
  # Comprueba dos cosas distintas:
  #   1. La misma batería que el CI de PRs (lint, typecheck, tests, contraste,
  #      i18n, build, cargo check/test y clippy bloqueante). Un tag puede
  #      apuntar a un commit que nunca pasó por CI —o a uno de otra rama—, así
  #      que no basta con que el CI de `main` estuviera verde.
  #   2. Coherencia del tag: la versión del tag debe coincidir con la de
  #      `package.json` y `Cargo.toml`, y el CHANGELOG debe tener su sección.
  verify:
    runs-on: ubuntu-latest
    name: Verify release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # La versión de Rust sale de `src-tauri/rust-toolchain.toml`, nunca del canal
      # flotante: con clippy bloqueante en este mismo job, un Rust nuevo en el
      # runner tumbaba la publicación sin que el código hubiera cambiado (v1.54.0).
      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      - name: Install JS dependencies
        run: npm ci

      # El tag manda: si no cuadra con package.json / Cargo.toml / CHANGELOG,
      # el release se aborta antes de tocar un solo secreto.
      - name: Coherencia del tag con la versión y el changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          echo "tag=$TAG  package.json=$PKG  Cargo.toml=$CARGO"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::El tag v$TAG no coincide con package.json ($PKG)."
            exit 1
          fi
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::El tag v$TAG no coincide con Cargo.toml ($CARGO). Ejecuta 'npm run sync-version'."
            exit 1
          fi
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene una sección '## [$TAG]'."
            exit 1
          fi

      - name: Coherencia de versión propagada
        run: npm run check:version

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Contraste WCAG de temas (estricto)
        run: npm run check:contrast:ci

      - name: i18n sin texto hardcodeado (estricto)
        run: npm run check:i18n:ci

      - name: Build frontend
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: cargo clippy (bloqueante)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  # Un único creador antes de la matriz: GitHub admite varios borradores con
  # el mismo tag si las plataformas intentan crearlos simultáneamente.
  prepare_release:
    needs: verify
    runs-on: ubuntu-latest
    name: Crear borrador único
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Crear o recuperar el borrador del tag
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp |
            jq --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)]' > releases.json
          count=$(jq 'length' releases.json)
          if [ "$count" -gt 1 ]; then
            echo "::error::Hay varios borradores para ${GITHUB_REF_NAME}; hay que reunir sus assets antes de continuar."
            exit 1
          elif [ "$count" -eq 1 ]; then
            jq -e '.[0].draft == true' releases.json > /dev/null || {
              echo "::error::La versión ya está publicada; no se reemplazan sus artefactos."
              exit 1
            }
            release_id=$(jq -r '.[0].id' releases.json)
          else
            ./scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
            printf '\n---\n\nRegistro completo: [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" >> release-notes.md
            release_id=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Rustty ${GITHUB_REF_NAME}" \
              -f target_commitish="$GITHUB_SHA" -F draft=true -F prerelease=false \
              -F body=@release-notes.md --jq '.id')
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target:   x86_64-unknown-linux-gnu
            label:    Linux (.deb)
          - platform: windows-latest
            target:   x86_64-pc-windows-msvc
            label:    Windows (portable)

    runs-on: ${{ matrix.platform }}
    name: Build · ${{ matrix.label }}

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── Node.js ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # ── Rust ──────────────────────────────────────────────────
      # Mismo toolchain que el gate `verify` y que el desarrollo local: lo dicta
      # `src-tauri/rust-toolchain.toml`. Si aquí flotara, se publicarían binarios
      # compilados con un compilador que nadie ha verificado.
      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # ── Dependencias del sistema (solo Linux) ─────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev \
            pkg-config

      # ── Dependencias JS ───────────────────────────────────────
      - name: Install JS dependencies
        run: npm ci

      # ── Build Tauri ───────────────────────────────────────────
      # Solo se publican dos artefactos: el .deb (Debian/Ubuntu) y el .exe
      # portable de Windows. Se compila con la CLI de Tauri y se sube con `gh`;
      # no hace falta tauri-action ni manifiesto de actualizaciones.
      - name: Build .deb (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          RUSTTY_GOOGLE_DRIVE_CLIENT_ID:     ${{ secrets.RUSTTY_GOOGLE_DRIVE_CLIENT_ID }}
          RUSTTY_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.RUSTTY_GOOGLE_DRIVE_CLIENT_SECRET }}
        shell: bash
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles deb

      # Sin instalador: el binario de `release/` ya es el ejecutable portable.
      # `shell: bash` en ambos: en pwsh, el shim `npm.ps1` puede comerse el `--`.
      - name: Build portable .exe (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          RUSTTY_GOOGLE_DRIVE_CLIENT_ID:     ${{ secrets.RUSTTY_GOOGLE_DRIVE_CLIENT_ID }}
          RUSTTY_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.RUSTTY_GOOGLE_DRIVE_CLIENT_SECRET }}
        shell: bash
        run: npm run tauri build -- --target ${{ matrix.target }} --no-bundle

      # ── Recoger el artefacto con su nombre final ──────────────
      # Con tag, la versión sale del tag (el gate ya comprobó que coincide con
      # package.json); en una ejecución manual, de package.json.
      - name: Recoger artefacto
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BASE="src-tauri/target/${{ matrix.target }}/release"
          mkdir -p dist-release
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "$BASE/rustty.exe" "dist-release/Rustty_${VERSION}_x64-portable.exe"
          else
            shopt -s nullglob
            DEBS=("$BASE"/bundle/deb/*.deb)
            if [ "${#DEBS[@]}" -ne 1 ]; then
              echo "::error::Se esperaba exactamente un .deb y hay ${#DEBS[@]}."
              exit 1
            fi
            cp "${DEBS[0]}" dist-release/
          fi
          ls -la dist-release

      # ── Subir al borrador del tag ─────────────────────────────
      - name: Subir al release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist-release/* \
            --clobber --repo "${GITHUB_REPOSITORY}"

      # Ejecución manual (sin tag): prueba de compilación; el artefacto queda
      # descargable desde la página del run.
      - name: Subir como artefacto del run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustty-${{ matrix.target }}-${{ github.sha }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  publish_release:
    needs: [build, prepare_release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Publish release
    # `id-token` + `attestations` los exige `attest-build-provenance` (firma
    # con OIDC contra el registro de procedencia). Se conceden aquí y solo
    # aquí: ningún otro job del workflow debe poder emitir procedencia.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Red de seguridad: el release debe llevar los dos artefactos que se
      # anuncian (el .deb y el .exe portable). Si falta uno, se rompe la
      # publicación en lugar de publicar una versión a medias.
      - name: Verificar los artefactos del release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ID="${{ needs.prepare_release.outputs.release_id }}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[].name' > assets.txt
          cat assets.txt
          missing=0
          grep -qxF "Rustty_${VERSION}_x64-portable.exe" assets.txt || {
            echo "::error::Falta Rustty_${VERSION}_x64-portable.exe en el release."
            missing=1
          }
          grep -qE '\.deb$' assets.txt || {
            echo "::error::Falta el paquete .deb en el release."
            missing=1
          }
          [ "$missing" -eq 0 ]

      # ── Manifiesto de checksums ────────────────────────────────────────
      # Hasta ahora el `sha256` que el README invita a comprobar se leía de la
      # propia página del release: quien pudiera alterar los binarios podría
      # alterar también el número al lado. Un manifiesto **firmado** rompe esa
      # circularidad — la firma la aporta la attestation del paso siguiente, que
      # se emite fuera del release, en el registro de procedencia de GitHub.
      - name: Generar SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          gh release download "${GITHUB_REF_NAME}" \
            --dir dist-assets --clobber --repo "${GITHUB_REPOSITORY}"
          # `SHA256SUMS.txt` no puede firmarse a sí mismo: si una ejecución
          # anterior lo dejó subido, se descarta DESPUÉS de descargar, porque
          # `gh release download` no sabe excluir por nombre.
          rm -f dist-assets/SHA256SUMS.txt
          cd dist-assets
          sha256sum -- * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt \
            --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --draft=false \
            --repo "${GITHUB_REPOSITORY}"

      # Procedencia verificable: ata el manifiesto a este workflow, este commit
      # y este runner. Como el manifiesto cubre todos los artefactos por hash,
      # attestarlo a él los cubre a todos:
      #   gh attestation verify SHA256SUMS.txt --repo <owner>/<repo>
      #   sha256sum --check --ignore-missing SHA256SUMS.txt
      # (p. ej. con rustty_x.y.z_amd64.deb o Rustty_x.y.z_x64-portable.exe al lado).
      # Va DESPUÉS de publicar a propósito: si la emisión fallara, el release ya
      # está disponible y solo queda este job en rojo, no la entrega bloqueada.
      - name: Attestation de procedencia del manifiesto
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: SHA256SUMS.txt
