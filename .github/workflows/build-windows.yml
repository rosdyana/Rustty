name: Build Windows

# Compila el .exe portable de Windows en un runner de GitHub en cada push (de
# cualquier rama) y en cada PR contra main, para no hacerlo en el equipo local.
# No publica nada: sube el .exe portable como artefacto del run (descargable
# desde la página del run o con `gh run download`). El release con tag lo hace
# build.yml.
#
# Los cambios que solo tocan documentación no disparan el build. También se
# puede lanzar a mano:
#
#   gh workflow run build-windows.yml --ref feat/embedded-rdp
#
# Nota: `workflow_dispatch` solo aparece en la UI y en `gh` cuando el fichero
# existe en la rama por defecto (main).
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "web/docs/**"
      - "images/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "web/docs/**"
      - "images/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    name: Build · Windows (x64)
    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # Mismo toolchain que el resto de workflows: lo dicta rust-toolchain.toml.
      - name: Leer el toolchain fijado
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/channel=\1/p' src-tauri/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ env.TARGET }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: windows-${{ env.TARGET }}

      - name: Install JS dependencies
        run: npm ci

      # Solo el ejecutable portable, sin instalador (`--no-bundle`), igual que
      # build.yml. Los secretos de Google Drive se inyectan igual que allí.
      - name: Build Tauri (Windows, portable)
        env:
          RUSTTY_GOOGLE_DRIVE_CLIENT_ID:     ${{ secrets.RUSTTY_GOOGLE_DRIVE_CLIENT_ID }}
          RUSTTY_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.RUSTTY_GOOGLE_DRIVE_CLIENT_SECRET }}
        # bash y no pwsh: el shim `npm.ps1` de PowerShell puede comerse el `--`.
        shell: bash
        run: npm run tauri build -- --target ${{ env.TARGET }} --no-bundle

      - name: Recoger artefactos
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "windows-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri/target/$env:TARGET/release/rustty.exe" "$out/rustty-portable.exe"
          Get-ChildItem $out | Format-Table Name, Length

      - name: Subir el portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustty-windows-x64-${{ github.sha }}
          path: windows-artifacts/*
          if-no-files-found: error
          retention-days: 14
